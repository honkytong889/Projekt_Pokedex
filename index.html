<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="scripts/templates.js" defer></script>
    <script src="script.js" defer></script>

    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="wrapper border-big fixed-header">
        <div>
            <img src="assets/img/pokeball.webp" alt="Pokeball">

            <h1>Pokedex</h1>
        </div>
        <div>
            <label for="#Search">Search Pokémon:</label>
            <input data-id="search-input" id="#Search" class="input-search" type="search" name="search" minlength="3"
                placeholder="min 3 lts" required onkeyup="pressEnter(event, 'search')">
            <button data-id="search-button" onclick="checkSearchInput()" type="submit" class="btn-icon">
                <img src="assets/icons/search.svg" alt="search for Pokémon">
            </button>
        </div>
    </header>
    <main>
        <div></div>
    </main>
    <footer>
        <a href="##PageStart">
            <img onclick="showAllLoadedPokemon()" src="assets/img/pokeball.webp" alt="to the start of the page">
        </a>
    </footer>


</body>

</html>
